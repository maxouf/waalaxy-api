[project]
name = "waalaxy-api"
version = "0.1.0"
description = "Client de l'API interne Waalaxy + serveur MCP (stats, brouillons, lancement de campagnes)."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "mcp>=1.9,!=2.0.0.dev0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
waalaxy = "waalaxy_api.client:main"
waalaxy-mcp = "waalaxy_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waalaxy_api", "src/waalaxy_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
